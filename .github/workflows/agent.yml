name: claw-agent
run-name: claw / ${{ github.actor }} / ${{ inputs.session_id }}

on:
  workflow_dispatch:
    inputs:
      session_id:
        description: Session id minted by the github-claw platform
        required: true
        type: string

# Only one live job per session; different sessions run in parallel.
concurrency:
  group: claw-agent-${{ inputs.session_id }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  agent:
    runs-on: macos-latest
    timeout-minutes: 360
    env:
      PLATFORM_URL: ${{ vars.PLATFORM_URL }}
      SESSION_ID: ${{ inputs.session_id }}
      OIDC_AUDIENCE: github-claw
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # OIDC exchange + payload download. Persists CLAW_* env (incl. the
      # session token) to GITHUB_ENV for the following steps.
      - name: Exchange credentials
        shell: bash
        run: |
          set -euo pipefail
          set +x
          export CLAW_TMP="${RUNNER_TEMP}/claw"
          mkdir -p "$CLAW_TMP"
          scripts/exchange.sh

      # Platform machine prep: tools, the claw user, VNC/SSH, session tunnel.
      - name: Machine setup
        shell: bash
        run: |
          set -euo pipefail
          set +x
          "${CLAW_DIR}/${CLAW_ENTRY}"

      # Optional user hook: bootstrap.sh at the memory bucket root (edit it at
      # ~/claw/bootstrap.sh from any agent session, or via the admin file
      # browser). Runs with the claw user created but memory NOT yet mounted,
      # right before the agent starts. Failures show on this step but never
      # block the agent.
      - name: Bootstrap
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          set +x
          if [[ -f "${CLAW_DIR}/user_bootstrap.sh" ]]; then
            "${CLAW_DIR}/user_bootstrap.sh"
          else
            echo "no bootstrap.sh in memory; skipping"
          fi

      # Mount memory, configure the agent backend, hand off to the driver.
      - name: Run agent
        shell: bash
        run: |
          set -euo pipefail
          set +x
          AGENT_ENTRY="${CLAW_DIR}/start_agent.sh"
          # Fallback for payloads predating the setup/agent split.
          [[ -f "$AGENT_ENTRY" ]] || AGENT_ENTRY="${CLAW_DIR}/${CLAW_ENTRY}"
          exec "$AGENT_ENTRY"
