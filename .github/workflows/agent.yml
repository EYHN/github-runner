name: claw-agent
run-name: claw / ${{ github.actor }} / ${{ inputs.session_id }}

on:
  workflow_dispatch:
    inputs:
      session_id:
        description: Session id minted by the github-claw platform
        required: true
        type: string

# Only one live job per session; different sessions run in parallel.
concurrency:
  group: claw-agent-${{ inputs.session_id }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  agent:
    runs-on: macos-latest
    timeout-minutes: 360
    env:
      PLATFORM_URL: ${{ vars.PLATFORM_URL }}
      SESSION_ID: ${{ inputs.session_id }}
      OIDC_AUDIENCE: github-claw
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # OIDC exchange + payload download. Persists CLAW_* env (incl. the
      # session token) to GITHUB_ENV for the following steps.
      - name: Exchange credentials
        shell: bash
        run: |
          set -euo pipefail
          set +x
          export CLAW_TMP="${RUNNER_TEMP}/claw"
          mkdir -p "$CLAW_TMP"
          scripts/exchange.sh

      # Platform machine prep: tools, the claw user, SSH, session tunnel.
      - name: Machine setup
        shell: bash
        run: |
          set -euo pipefail
          set +x
          "${CLAW_DIR}/${CLAW_ENTRY}"

      # Cache key for the memory bootstrap hook: derived from the hook's own
      # contents, so editing the hook gives a fresh cache (clean slate) rather
      # than dragging the previous toolchain's leftovers forward. Exposes
      # $CLAW_CACHE. No restore-keys: an exact-key miss means "bootstrap
      # changed", which must NOT reuse the old cache.
      - name: Bootstrap cache key
        id: bootcache
        shell: bash
        run: |
          set -euo pipefail
          set +x
          HOOK="${CLAW_DIR}/user_bootstrap.sh"
          if [[ -f "$HOOK" ]]; then
            H="$(shasum -a 256 "$HOOK" | cut -d' ' -f1)"
          else
            H="none"
          fi
          echo "key=claw-cache-${ENV_KIND}-${H}" >> "$GITHUB_OUTPUT"
          echo "CLAW_CACHE=${HOME}/claw-cache" >> "$GITHUB_ENV"
          mkdir -p "${HOME}/claw-cache"

      - name: Restore bootstrap cache
        uses: actions/cache/restore@v4
        with:
          path: ~/claw-cache
          key: ${{ steps.bootcache.outputs.key }}

      # Optional user hook: bootstrap.sh at the memory bucket root (edit it at
      # ~/claw/bootstrap.sh from any agent session, or via the admin file
      # browser). Runs with the claw user created but memory NOT yet mounted,
      # right before the agent starts. Route slow downloads into $CLAW_CACHE to
      # persist them across machines. Failures show here but never block the agent.
      - name: Bootstrap (memory)
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          set +x
          if [[ -f "${CLAW_DIR}/user_bootstrap.sh" ]]; then
            "${CLAW_DIR}/user_bootstrap.sh"
          else
            echo "no bootstrap.sh in memory; skipping"
          fi

      # Start the agent in the BACKGROUND so it begins serving immediately; the
      # slow cache upload (next step) and the agent then run concurrently. The
      # process survives into the wait step (Actions doesn't kill background
      # jobs between steps). start_agent.sh mounts memory, configures the
      # backend, and runs the driver.
      - name: Start agent
        shell: bash
        run: |
          set -euo pipefail
          set +x
          AGENT_ENTRY="${CLAW_DIR}/start_agent.sh"
          # Fallback for payloads predating the setup/agent split.
          [[ -f "$AGENT_ENTRY" ]] || AGENT_ENTRY="${CLAW_DIR}/${CLAW_ENTRY}"
          nohup bash "$AGENT_ENTRY" >"${CLAW_TMP}/agent.log" 2>&1 &
          echo $! > "${CLAW_TMP}/agent.pid"
          sleep 3   # surface immediate crashes (mount/setup) in this step
          kill -0 "$(cat "${CLAW_TMP}/agent.pid")" 2>/dev/null \
            && echo "agent started (pid $(cat "${CLAW_TMP}/agent.pid"))" \
            || { echo "agent exited during startup:"; cat "${CLAW_TMP}/agent.log"; exit 1; }

      # Persist whatever the hook routed into $CLAW_CACHE, concurrently with the
      # now-running agent. Skips upload when the exact key already exists.
      - name: Save bootstrap cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/claw-cache
          key: ${{ steps.bootcache.outputs.key }}

      # Hold the job open for the session's lifetime by following the agent
      # process; stream its log into this step. Exits when the driver does
      # (session closed) or when the platform cancels the run.
      - name: Run agent
        shell: bash
        run: |
          set -uo pipefail
          set +x
          PID="$(cat "${CLAW_TMP}/agent.pid")"
          tail -f "${CLAW_TMP}/agent.log" &
          TAIL=$!
          while kill -0 "$PID" 2>/dev/null; do sleep 10; done
          kill "$TAIL" 2>/dev/null || true
          echo ">>> agent process exited"
